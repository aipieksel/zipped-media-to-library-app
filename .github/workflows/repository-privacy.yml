name: Repository privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-repository-privacy.mjs
      - run: node --test tests/repository-privacy.test.mjs
